<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agency - Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1016;
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        ul {
            list-style: none;
        }

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Navbar Layout */
        .navbar {
            width: 100%;
            background-color: #0f1016;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 100;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .brand-logo span {
            color: #6c5ce7;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            font-size: 15px;
            font-weight: 500;
            color: #b3b3ba;
            padding: 6px 0;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #ffffff;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #6c5ce7;
            border-radius: 2px;
        }

        .btn-primary {
            display: inline-block;
            background-color: #6c5ce7;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #6c5ce7;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary:hover {
            background-color: #5b4cc4;
            border-color: #5b4cc4;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        /* Blog Hero Section Styles */
        .blog-hero-section {
            padding: 80px 0 60px 0;
            background-color: #0f1016;
            color: #ffffff;
            text-align: center;
        }

        .blog-hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(108, 92, 231, 0.1);
            color: #a29bfe;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .blog-hero-title {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -1px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .blog-hero-subtitle {
            font-size: 17px;
            color: #b3b3ba;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="container navbar-content">
            <a href="home.html" class="brand-logo">Agency<span>.</span></a>
            
            <nav>
                <ul class="nav-links">
                    <li class="nav-item"><a href="home.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="services.html" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="portfolio.html" class="nav-link">Portfolio</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link active">Blog</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>

            <a href="contact.html" class="btn-primary">Schedule a Call</a>
        </div>
    </header>

    <!-- Blog Hero Section -->
    <section class="blog-hero-section">
        <div class="container">
            <div class="blog-hero-badge">⚡ Design & No-Code Insights</div>
            <h1 class="blog-hero-title">Design & No-Code Insights</h1>
            <p class="blog-hero-subtitle">Get actionable tips and war stories—no fluff, just fuel. Join 5,000+ builders.</p>
        </div>
    </section>

</body>
</html>
